name: Build and publish Android and web together
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [shared-source-updated]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: bonye-paired-publication
  cancel-in-progress: false
jobs:
  paired:
    if: github.event_name != 'schedule' || vars.BONYE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.bonye-android
    steps:
      - uses: actions/checkout@v4
        with:
          path: webapp
      - uses: actions/checkout@v4
        with:
          repository: hpeikanian/bonyeapp
          ref: main
          path: shared-source
          token: ${{ secrets.BONYE_SOURCE_TOKEN || github.token }}
      - name: Skip unchanged scheduled publications
        id: change
        env:
          EVENT: ${{ github.event_name }}
        run: python3 webapp/tool/publication_needed.py shared-source
      - name: Check FTPS connection before builds
        if: steps.change.outputs.needed == 'true' && vars.BONYE_DEPLOY_ENABLED == 'true'
        env:
          BONYE_FTP_HOST: ${{ secrets.BONYE_FTP_HOST }}
          BONYE_FTP_USER: ${{ secrets.BONYE_FTP_USER }}
          BONYE_FTP_PASSWORD: ${{ secrets.BONYE_FTP_PASSWORD }}
          BONYE_FTP_PORT: ${{ vars.BONYE_FTP_PORT || '21' }}
          BONYE_FTP_APP_ONLY: ${{ vars.BONYE_FTP_APP_ONLY }}
        run: python3 webapp/tool/deploy_ftps.py --check-connection
      - uses: actions/setup-java@v4
        if: steps.change.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        if: steps.change.outputs.needed == 'true'
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Restore existing Android signing identity
        if: steps.change.outputs.needed == 'true' && vars.BONYE_DEPLOY_ENABLED == 'true'
        env:
          BONYE_ANDROID_KEYSTORE_BASE64: ${{ secrets.BONYE_ANDROID_KEYSTORE_BASE64 }}
        run: python3 webapp/tool/restore_android_signing.py
      - name: Verify shared app and build Android
        if: steps.change.outputs.needed == 'true'
        working-directory: shared-source
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build apk --debug --target-platform android-arm64
      - name: Build and test web from the same revision
        if: steps.change.outputs.needed == 'true'
        run: |
          python3 webapp/tool/sync_source.py shared-source
          cd webapp
          python3 -m unittest discover -s tool/tests -v
          ./tool/build_web.sh
          flutter test test/podcast_cache_browser.dart --platform chrome
      - name: Prepare signature-verified Android update
        if: steps.change.outputs.needed == 'true' && vars.BONYE_DEPLOY_ENABLED == 'true'
        run: |
          python3 webapp/tool/prepare_android_update.py shared-source shared-source/build/app/outputs/flutter-apk/app-debug.apk webapp/build/web --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - uses: actions/upload-artifact@v4
        if: steps.change.outputs.needed == 'true'
        with:
          name: bonye-paired-build
          path: |
            webapp/build/web/
            shared-source/build/app/outputs/flutter-apk/app-debug.apk
          include-hidden-files: true
      - name: Prevent Android version downgrade
        if: steps.change.outputs.needed == 'true' && vars.BONYE_DEPLOY_ENABLED == 'true'
        run: python3 webapp/tool/check_release_monotonic.py webapp/build/web
      - name: Publish through app-only FTPS account
        if: steps.change.outputs.needed == 'true' && vars.BONYE_DEPLOY_ENABLED == 'true'
        env:
          BONYE_FTP_HOST: ${{ secrets.BONYE_FTP_HOST }}
          BONYE_FTP_USER: ${{ secrets.BONYE_FTP_USER }}
          BONYE_FTP_PASSWORD: ${{ secrets.BONYE_FTP_PASSWORD }}
          BONYE_FTP_PORT: ${{ vars.BONYE_FTP_PORT || '21' }}
          BONYE_FTP_APP_ONLY: ${{ vars.BONYE_FTP_APP_ONLY }}
        run: python3 webapp/tool/deploy_ftps.py webapp/build/web
      - name: Verify published revision and update manifest
        if: steps.change.outputs.needed == 'true' && vars.BONYE_DEPLOY_ENABLED == 'true'
        run: python3 webapp/tool/verify_publication.py webapp/build/web
      - name: Remove restored signing key
        if: always()
        run: rm -f "$ANDROID_USER_HOME/debug.keystore"
